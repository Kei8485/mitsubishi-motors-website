<div
  class="mm-stage mm-hud-corners"
  [class.mm-stage--hero]="variant === 'hero'"
  [class.mm-stage--card]="variant === 'card'"
  [class.mm-stage--placeholder]="stageMode === 'placeholder'"
>
  <!-- Dashed Elliptical Podium -->
  <div class="mm-stage__podium mm-turntable-ellipse" aria-hidden="true">
    @if (variant === 'card') {
      <ion-badge class="mm-stage__badge">3D</ion-badge>
    }
  </div>

  <!-- 1. Multi-Slide Smooth Cross-Fade Mode (Hero Carousel) -->
  @if (slides.length > 0) {
    <div class="mm-stage__slides">
      @for (slide of slides; track slide.id; let idx = $index) {
        <img
          src="{{ slide.imageSrc }}"
          alt="{{ slide.altText }}"
          class="mm-stage__vehicle-img mm-stage__vehicle-img--slide"
          [class.is-active]="idx === activeIndex"
          [class.is-prev]="idx < activeIndex"
          [class.is-next]="idx > activeIndex"
          [attr.fetchpriority]="priority && idx === 0 ? 'high' : 'auto'"
          loading="eager"
          decoding="async"
        />
      }
    </div>
  } @else if (stageMode === '3d') {
    <!--
      2. 3D Model Mode (stageMode === '3d')
      Drop a <model-viewer [attr.src]="model3dSrc" auto-rotate camera-controls />
      or project a custom <canvas stage3d> element inside <app-vehicle-stage>.
    -->
    <div class="mm-stage__3d-slot" [attr.data-model-src]="model3dSrc">
      <ng-content select="[stage3d]" />
    </div>
  } @else if (stageMode === 'image' && imageSrc) {
    <!--
      3. 2D Cutout Image Mode (stageMode === 'image')
      Displays the transparent PNG vehicle render from `site-data.ts`.
    -->
    <img
      src="{{ imageSrc }}"
      alt="{{ altText }}"
      class="mm-stage__vehicle-img"
      [attr.fetchpriority]="priority ? 'high' : 'auto'"
      [attr.loading]="priority ? 'eager' : 'lazy'"
      decoding="async"
    />
  }
  <!--
    4. Placeholder Mode (stageMode === 'placeholder')
    Leaves only the HUD corner brackets + 3D elliptical turntable ring visible.
  -->
</div>
