<ion-card class="mm-vehicle-card" (click)="onSelect()" tabindex="0" (keydown.enter)="onSelect()">
  <!-- Top Badges: Category & Year -->
  <ion-card-header class="mm-vehicle-card__header">
    <ion-badge class="mm-pill">{{ vehicle.category }}</ion-badge>
    <ion-badge class="mm-pill">[{{ vehicle.year }}]</ion-badge>
  </ion-card-header>

  <!-- Vehicle 3D/PNG Turntable Stage -->
  <app-vehicle-stage
    [imageSrc]="vehicle.image"
    [altText]="vehicle.year + ' Mitsubishi ' + vehicle.name"
    variant="card"
  />

  <!-- Bottom Details: Title, Starting Price, Spec Pills -->
  <ion-card-content class="mm-vehicle-card__body">
    <ion-card-title class="mm-vehicle-card__title">{{ vehicle.name }}</ion-card-title>

    <div class="mm-vehicle-card__price-row">
      <ion-text class="mm-vehicle-card__price">{{ vehicle.startingPrice }}</ion-text>
      <ion-note class="mm-vehicle-card__price-label">STARTING</ion-note>
    </div>

    <div class="mm-vehicle-card__specs">
      @for (spec of vehicle.cardSpecs; track spec) {
        <ion-badge class="mm-pill">[{{ spec }}]</ion-badge>
      }
    </div>
  </ion-card-content>
</ion-card>
