<ion-card [routerLink]="item.route" class="mm-promo-card">
  <!-- Atmospheric Background Image + Dark Crimson Vignette Overlay -->
  @if (item.bgImage) {
    <div class="mm-promo-card__bg" aria-hidden="true">
      <img
        src="{{ item.bgImage }}"
        alt="{{ item.title }} background"
        class="mm-promo-card__bg-img"
        loading="lazy"
        decoding="async"
      />
      <div class="mm-promo-card__scrim"></div>
    </div>
  }

  <ion-card-content class="mm-promo-card__content">
    <ion-card-subtitle class="mm-promo-card__tag">{{ item.tag }}</ion-card-subtitle>
    <ion-card-title class="mm-promo-card__title">{{ item.title }}</ion-card-title>
    <ion-text class="mm-promo-card__cta">
      <span>VIEW</span>
      <ion-icon name="arrow-forward-outline" class="mm-promo-card__icon" aria-hidden="true"></ion-icon>
    </ion-text>
  </ion-card-content>
</ion-card>
