<a [routerLink]="item.route" class="mm-promo-card">
  <!-- Atmospheric Background Image + Dark Crimson Vignette Overlay -->
  @if (item.bgImage) {
    <div class="mm-promo-card__bg" aria-hidden="true">
      <img
        src="{{ item.bgImage }}"
        alt="{{ item.title }} background"
        class="mm-promo-card__bg-img"
        loading="lazy"
        decoding="async"
      />
      <div class="mm-promo-card__scrim"></div>
    </div>
  }

  <div class="mm-promo-card__content">
    <span class="mm-promo-card__tag">{{ item.tag }}</span>
    <h3 class="mm-promo-card__title">{{ item.title }}</h3>
    <span class="mm-promo-card__cta">
      <span>VIEW</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path
          d="M2 6H10M10 6L6.5 2.5M10 6L6.5 9.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="square"
        />
      </svg>
    </span>
  </div>
</a>
